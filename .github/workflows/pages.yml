name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static preview
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          customer_base="/${repository_name}/"
          customer_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/"
          admin_url="${customer_url}admin/"
          mkdir -p site/admin
          cp apps/customer-pwa/public/damazon-logo.png site/damazon-logo.png
          cp apps/customer-pwa/public/favicon-48.png site/favicon-48.png
          sed \
            -e "s|__CUSTOMER_BASE__|${customer_base}|g" \
            -e "s|__CUSTOMER_URL__|${customer_url}|g" \
            -e "s|__ADMIN_URL__|${admin_url}|g" \
            -e "s|__REPOSITORY_URL__|https://github.com/${GITHUB_REPOSITORY}|g" \
            deployment/pages-preview/customer.html > site/index.html
          sed \
            -e "s|__CUSTOMER_BASE__|${customer_base}|g" \
            -e "s|__CUSTOMER_URL__|${customer_url}|g" \
            deployment/pages-preview/admin.html > site/admin/index.html
          cp deployment/github-pages-404.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
