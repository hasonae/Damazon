<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#453d35" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="معاينة ثابتة للوحة إدارة دامازون. لا تتوفر وظائف الإدارة أو بيانات حقيقية."
    />
    <link rel="icon" type="image/png" sizes="48x48" href="__CUSTOMER_BASE__favicon-48.png" />
    <title>دامازون | معاينة لوحة الإدارة</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        color: #292621;
        background: #f3f2ef;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 1.25rem;
        background: radial-gradient(ellipse at 20% 85%, #dfddd6 0, transparent 32rem), #f3f2ef;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #e1dfd9;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 1.5rem 5rem rgb(39 34 28 / 10%);
        text-align: center;
      }

      .logo {
        width: 4.5rem;
        height: 4.5rem;
        margin-bottom: 1.2rem;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0;
        color: #746b61;
        font-size: 0.9rem;
        font-weight: 700;
      }

      h1 {
        margin: 0.65rem 0;
        font-size: clamp(1.8rem, 6vw, 2.7rem);
        letter-spacing: -0.035em;
      }

      p {
        color: #615d56;
        line-height: 1.9;
      }

      .warning {
        margin: 1.8rem 0;
        padding: 1rem 1.1rem;
        border: 1px solid #ead8b4;
        border-radius: 0.75rem;
        background: #fbf5e9;
        color: #634c27;
        font-weight: 650;
        text-align: start;
      }

      a {
        display: inline-flex;
        min-height: 2.8rem;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.1rem;
        border-radius: 0.65rem;
        background: #453d35;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #302a25;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="__CUSTOMER_BASE__damazon-logo.png"
        alt="شعار دامازون"
        width="72"
        height="72"
      />
      <p class="eyebrow">المساحة الإدارية</p>
      <h1>لوحة إدارة دامازون</h1>
      <p>هذه معاينة ثابتة لهوية لوحة الإدارة، وليست لوحة تشغيلية.</p>
      <div class="warning" role="status">
        لا تسجّل الدخول هنا. المصادقة وإدارة الحسابات والطلبات والإعلانات والبيانات غير متاحة في
        المعاينة.
      </div>
      <a href="__CUSTOMER_URL__">العودة إلى معاينة المتجر</a>
    </main>
  </body>
</html>
