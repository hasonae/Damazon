name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DAMAZON_API_BASE_URL: ${{ vars.DAMAZON_API_BASE_URL }}
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require a deployed API endpoint
        shell: bash
        run: |
          if [[ -z "$DAMAZON_API_BASE_URL" ]]; then
            echo "Set the repository Actions variable DAMAZON_API_BASE_URL to the deployed HTTPS API URL ending in /api/v1." >&2
            exit 1
          fi
          if [[ "$DAMAZON_API_BASE_URL" != https://* || "$DAMAZON_API_BASE_URL" != */api/v1 ]]; then
            echo "DAMAZON_API_BASE_URL must use HTTPS and end in /api/v1." >&2
            exit 1
          fi

      - name: Build customer PWA
        env:
          VITE_API_BASE_URL: ${{ env.DAMAZON_API_BASE_URL }}
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_CONSOLE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin/
        run: |
          npm run build:packages
          npm run build --workspace @damazon/customer-pwa

      - name: Build admin PWA
        env:
          VITE_API_BASE_URL: ${{ env.DAMAZON_API_BASE_URL }}
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}admin/
          VITE_STOREFRONT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build --workspace @damazon/admin-pwa

      - name: Assemble Pages site
        run: |
          mkdir -p site/admin
          cp -R apps/customer-pwa/dist/. site/
          cp -R apps/admin-pwa/dist/. site/admin/
          cp deployment/github-pages-404.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
