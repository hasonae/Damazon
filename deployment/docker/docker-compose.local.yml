name: damazon-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: damazon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: damazon
      POSTGRES_PASSWORD: damazon_dev_password
      POSTGRES_DB: damazon
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - damazon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U damazon -d damazon']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: damazon-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - damazon-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  damazon-postgres-data:
  damazon-redis-data:
